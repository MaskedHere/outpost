# Outpost — self-hosted game server panel
#
# This file targets ZimaOS/CasaOS's "Install a customized app" flow (compose import) and, with
# the x-casaos block filled in, the community App Store submission format. The x-casaos schema
# below is a best-effort reproduction from public CasaOS app-store examples — verify it against
# the current ZimaOS App Store submission docs before actually submitting it there (see
# docs/ZIMAOS_INSTALL.md).
#
# SECURITY NOTE: this mounts the host's Docker socket so Outpost can create/manage game-server
# containers. That gives the Outpost container root-equivalent power on the host, the same
# trust model as Portainer/Watchtower. Only run this on a NAS you control, and make sure you
# complete the admin setup screen the first time you open it — there is no anonymous access.

name: outpost

services:
  outpost:
    image: ghcr.io/outpost-panel/outpost:latest
    container_name: outpost
    restart: unless-stopped
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 3000
        published: "7420"
        protocol: tcp
    environment:
      # REQUIRED — Outpost refuses to start in production until this is changed. Generate one with
      # `openssl rand -hex 32`. Anyone who knows this value can forge an admin session.
      - JWT_SECRET=please-change-this-to-a-long-random-string
      # First host port handed out to game servers; each new server takes the next free one above it.
      # Whatever range you expect to use has to be reachable from outside if you want friends to join
      # without a tunnel (see the Public access tab for the no-port-forwarding options).
      - MC_PORT_RANGE_START=25565
      # Game-server RCON ports are published on the *host*, not inside this container.
      - RCON_HOST=host.docker.internal
      # REQUIRED, and must match the host side of the /data bind mount below. Outpost creates game
      # containers through the host's Docker socket, and the daemon resolves bind-mount sources on
      # the host — so it needs the host path, not Outpost's own /data. Without this, creating a
      # server fails with `mkdir /data: read-only file system`.
      - HOST_DATA_DIR=/DATA/AppData/outpost
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # Everything Outpost owns lives here: the SQLite database, each server's files, backups, and
      # the shared per-game content cache. The cache alone can reach tens of GB across games (7 Days
      # to Die is ~14GB on its own), so point this at a volume with room — and back it up if the
      # worlds matter to you.
      - type: bind
        source: /DATA/AppData/outpost
        target: /data
    x-casaos:
      architectures:
        - amd64
        - arm64
      main: outpost
      description:
        en_us: Self-hosted game server panel with a built-in Minecraft modpack studio. Spin up vanilla/Paper/Fabric/Forge servers, build modpacks from Modrinth, and share a client pack with friends in one click.
      tagline:
        en_us: Host game nights with your friends. No monthly fee.
      icon: https://raw.githubusercontent.com/outpost-panel/outpost/main/packaging/icon.png
      thumbnail: ""
      title:
        en_us: Outpost
      category: Game
      port_map: "7420"
      index: /
      scheme: http
      developer: outpost-panel
      author: outpost-panel
      web_ui: true
