# Outpost - self-hosted game server panel
#
# Import this through ZimaOS/CasaOS "Install a customized app", or run it with `docker compose up -d`
# on any Docker host. See docs/ZIMAOS_INSTALL.md.
#
# SECURITY: Outpost mounts the host's Docker socket so it can manage game-server containers, which
# gives it root-equivalent access to the host (the same trust model as Portainer). Only run it on a
# machine you control, keep it off the public internet, and finish the admin setup screen on first
# launch.

name: outpost

services:
  outpost:
    image: ghcr.io/maskedhere/outpost:latest
    container_name: outpost
    restart: unless-stopped
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 3000
        published: "7420"
        protocol: tcp
    environment:
      # REQUIRED: Outpost refuses to start while this is a placeholder. Generate one with
      # `openssl rand -hex 32`. Anyone who knows this value can forge an admin session.
      - JWT_SECRET=please-change-this-to-a-long-random-string
      # First host port handed out to game servers; each new server takes the next free port above
      # it. Forward this range on your router if friends should join without a tunnel.
      - MC_PORT_RANGE_START=25565
      # Game-server RCON ports are published on the host, not inside this container.
      - RCON_HOST=host.docker.internal
      # REQUIRED: must match the host side of the /data bind mount below. Game containers are created
      # through the host's Docker daemon, which resolves bind-mount sources on the host.
      - HOST_DATA_DIR=/DATA/AppData/outpost
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # Database, server files, backups, and the shared game cache. The cache can reach tens of GB
      # (7 Days to Die alone is ~14GB), so point this at a volume with room and back it up.
      - type: bind
        source: /DATA/AppData/outpost
        target: /data
    x-casaos:
      architectures:
        - amd64
        - arm64
      main: outpost
      description:
        en_us: Self-hosted game server panel with a built-in Minecraft modpack studio. Spin up vanilla/Paper/Fabric/Forge servers, build modpacks from Modrinth, and share a client pack with friends in one click.
      tagline:
        en_us: Host game nights with your friends. No monthly fee.
      # Served by Outpost itself. Replace the host with the address you open Outpost on; ZimaOS
      # loads it from your browser, so a LAN address works.
      icon: http://outpost.local:7420/icon.svg
      thumbnail: ""
      title:
        en_us: Outpost
      category: Game
      port_map: "7420"
      index: /
      scheme: http
      developer: MaskedHere
      author: Lamar Nielsen
      web_ui: true
