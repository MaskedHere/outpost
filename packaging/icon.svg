<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Kept byte-identical to apps/frontend/public/icon.svg so the NAS dashboard tile, the browser
       tab and the in-app logo are all the same mark. -->
  <defs>
    <linearGradient id="outpost-icon-grad" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04914f" />
      <stop offset="100%" stop-color="#76ffbc" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0d12" />
  <g transform="translate(64 64) scale(12)">
    <rect x="4" y="4" width="24" height="10" rx="3" fill="url(#outpost-icon-grad)" />
    <rect x="4" y="18" width="24" height="10" rx="3" fill="url(#outpost-icon-grad)" />
    <circle cx="10" cy="9" r="1.5" fill="#0b1f16" />
    <circle cx="10" cy="23" r="1.5" fill="#0b1f16" />
  </g>
</svg>
